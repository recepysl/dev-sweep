name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Redact folder and project names in paths if needed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead? If something was offered that shouldn't be, say which folder and what sits next to it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the app
        2. Open the dropdown
        3. …
  - type: textarea
    id: once
    attributes:
      label: Output of `--once`
      description: Run `/Applications/DevSweep.app/Contents/MacOS/DevSweep --once` (a dry run, nothing is deleted) and paste the relevant part.
      render: console
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 15.1"
    validations:
      required: true
